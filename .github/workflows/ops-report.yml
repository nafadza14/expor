name: Ops report

# Aggregate data-quality report (counts only, no personal data) plus a
# reachability/structure probe of candidate data sources, as seen from a
# GitHub runner. Results are committed as JSON to the `ops-reports`
# branch so they can be reviewed without logging in to Actions.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '50 22 * * *'   # daily 05:50 WIB

permissions:
  contents: write

concurrency:
  group: ops-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python_scrapers/requirements.txt
      - name: Install deps
        run: |
          pip install -r python_scrapers/requirements.txt
          python -m playwright install --with-deps chromium
      - name: DB report
        continue-on-error: true
        env:
          DATABASE_URL_POSTGRESS: ${{ secrets.DATABASE_URL_POSTGRESS }}
        run: python ops/db_report.py --out reports/db.json
      - name: Source probe
        continue-on-error: true
        run: python ops/probe.py --out reports/probe.json
      - name: Publish to ops-reports branch
        run: |
          mkdir -p /tmp/rep && cp -r reports/. /tmp/rep/ 2>/dev/null || true
          git config user.name "eksporin-ops"
          git config user.email "ops@users.noreply.github.com"
          git fetch origin ops-reports || true
          git checkout --orphan ops-reports-new
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/rep/. .
          echo "Generated by .github/workflows/ops-report.yml on $(date -u)" > README.md
          git add -A
          git commit -qm "ops report $(date -u +%FT%TZ)"
          git push -f origin HEAD:ops-reports
