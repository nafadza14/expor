# Bulk buyer import: official company registries (UK, FR, NO), certified
# organic importers (Agence BIO) and OpenStreetMap. Each source runs as
# its own job; a final job prints the database totals as notices on the
# run page (visible without logging in).
#
# Manual run:   gh workflow run bulk.yml
# One source:   gh workflow run bulk.yml -f source=osm
# Totals only:  gh workflow run bulk.yml -f source=counts

name: Bulk buyer import

on:
  workflow_dispatch:
    inputs:
      source:
        description: "all | uk | fr | no | bio | us | au | osm | counts"
        default: all
  push:
    branches: [main]
    paths:
      - 'python_scrapers/bulk/**'
      - '.github/workflows/bulk.yml'
  schedule:
    - cron: '17 20 * * 0'   # weekly, Monday 03:17 WIB

permissions:
  contents: read

concurrency:
  group: bulk-import
  cancel-in-progress: false

jobs:
  import:
    if: ${{ (github.event.inputs.source || 'all') != 'counts' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        source: [bio, no, uk, fr, us, au, osm0, osm1, osm2, osm3]
    steps:
      - name: Skip sources not requested
        id: want
        run: |
          WANT="${{ github.event.inputs.source || 'all' }}"
          SRC="${{ matrix.source }}"
          if [ "$WANT" = "all" ] || [ "$WANT" = "$SRC" ] || { [ "$WANT" = "osm" ] && [ "${SRC#osm}" != "$SRC" ]; }; then echo "run=1" >> $GITHUB_OUTPUT; else echo "run=0" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.want.outputs.run == '1'
      - uses: actions/setup-python@v5
        if: steps.want.outputs.run == '1'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python_scrapers/requirements.txt
      - name: Install deps
        if: steps.want.outputs.run == '1'
        run: pip install -r python_scrapers/requirements.txt
      - name: Import ${{ matrix.source }}
        if: steps.want.outputs.run == '1'
        env:
          DATABASE_URL_POSTGRESS: ${{ secrets.DATABASE_URL_POSTGRESS }}
        run: |
          if [ -z "$DATABASE_URL_POSTGRESS" ]; then echo "::error::DATABASE_URL_POSTGRESS secret not set"; exit 1; fi
          SRC="${{ matrix.source }}"
          case "$SRC" in
            osm*) python -m python_scrapers.bulk.run --source osm --shard "${SRC#osm}" --shards 4 --minutes 110 ;;
            *)    python -m python_scrapers.bulk.run --source "$SRC" ;;
          esac

  counts:
    needs: import
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python_scrapers/requirements.txt
      - run: pip install -r python_scrapers/requirements.txt
      - name: Database totals
        env:
          DATABASE_URL_POSTGRESS: ${{ secrets.DATABASE_URL_POSTGRESS }}
        run: python -m python_scrapers.bulk.run --source counts
