name: Enrich buyers (contacts)

# Contact enrichment v2 (python_scrapers/enrich): finds each buyer's own
# website (domain guessing + keyless search), harvests email/phone from
# contact / Impressum / legal pages, validates email domains via DNS MX,
# and records where every contact was found. Works through the queue in
# order (never-checked rows first), so every run makes forward progress.

on:
  schedule:
    - cron: '15 * * * *'
    - cron: '45 * * * *'
  workflow_dispatch:
    inputs:
      max:
        description: 'Max buyers to enrich this run'
        default: '600'
      mode:
        description: 'fresh | contacts | all'
        default: 'contacts'
      concurrency:
        description: 'Parallel enrichment workers per shard'
        default: '14'

# Only one enrich run at a time. Additional invocations queue behind
# it. Prevents the runaway that happened when self-chain + workflow_run
# both fired.
concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Four runners work on disjoint slices of the queue (id % 4), each from
    # its own IP, so search engines and websites see four light clients
    # instead of one heavy one.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python_scrapers/requirements.txt
      - name: Install deps
        run: pip install -r python_scrapers/requirements.txt
      - name: Self-test
        run: python -m python_scrapers.tests.test_enrich
      - name: Run enricher v2 (website discovery + Impressum/contact harvest + MX check)
        env:
          DATABASE_URL_POSTGRESS: ${{ secrets.DATABASE_URL_POSTGRESS }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL_POSTGRESS" ]; then
            echo "::error::DATABASE_URL_POSTGRESS secret not set"
            exit 1
          fi
          MAX="${{ github.event.inputs.max || '600' }}"
          CONC="${{ github.event.inputs.concurrency || '14' }}"
          python -m python_scrapers.enrich.run --minutes 32 --max "$MAX" --concurrency "$CONC" --shard ${{ matrix.shard }} --shards 4
      # Self-dispatch next enrich run so the enrichment loop is also
      # continuous, independent of GitHub cron reliability.
      - name: Chain next enrich
        if: always() && matrix.shard == 0
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set +e
          if [ -z "$GH_TOKEN" ]; then
            echo "WORKFLOW_PAT not set. Skipping self-chain; relying on cron."
            exit 0
          fi
          sleep 60
          gh workflow run enrich.yml --repo ${{ github.repository }} \
            -f max=600 -f mode=contacts -f concurrency=14
          exit 0
