name: Crawl buyers (Python, aggressive)

# Multi-source Python crawler. Fires every hour on the free-tier cron,
# plus a self-chain trigger at the end of every run that dispatches
# the enrich workflow (which in turn re-dispatches crawl). GitHub
# Actions free-tier cron is best-effort, so we stack two schedules
# and rely on the chain to keep the pool moving continuously.

on:
  schedule:
    # Two staggered slots per hour. If GitHub drops one, the other
    # still lets the pool advance in that hour.
    - cron: '0 * * * *'
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Wall-clock budget for this run'
        default: '35'
      concurrency:
        description: 'Parallel crawl slices'
        default: '10'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r python_scrapers/requirements.txt
      - name: Run crawler
        env:
          DATABASE_URL_POSTGRESS: ${{ secrets.DATABASE_URL_POSTGRESS }}
          SUMOPOD_AI_KEY: ${{ secrets.SUMOPOD_AI_KEY }}
        run: |
          if [ -z "$DATABASE_URL_POSTGRESS" ]; then
            echo "::error::DATABASE_URL_POSTGRESS secret not set"
            exit 1
          fi
          MIN="${{ github.event.inputs.minutes || '35' }}"
          CONC="${{ github.event.inputs.concurrency || '10' }}"
          python python_scrapers/main.py run --minutes "$MIN" --concurrency "$CONC"
